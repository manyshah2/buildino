name: Buildino Runner WF-16

run-name: "Buildino WF-16 • ${{ inputs.build_target }} • ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Random Buildino request identifier
        required: true
        type: string
      build_target:
        description: apk, aab, both, ipa, or exe
        required: true
        type: string
      worker_url:
        description: Buildino Worker public origin
        required: true
        type: string

permissions: {}

concurrency:
  group: buildino-runner-wf16-${{ inputs.request_id }}
  cancel-in-progress: false

env:
  OIDC_AUDIENCE: buildino-worker-v0.4
  MAX_SOURCE_BYTES: "524288000"

jobs:
  build:
    name: Authenticated intake and isolated multi-platform build
    if: ${{ inputs.build_target == 'apk' || inputs.build_target == 'aab' || inputs.build_target == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
      id-token: write
    outputs:
      handoff_cache_key: ${{ steps.meta.outputs.handoff_cache_key }}

    steps:
      - name: Checkout trusted Runner template without credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_TARGET: ${{ inputs.build_target }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse

          request_id = os.environ["REQUEST_ID"]
          target = os.environ["BUILD_TARGET"]
          worker = urlparse(os.environ["WORKER_URL"])

          if not re.fullmatch(r"b[0-9]+-[0-9]+-[a-f0-9]{10}", request_id):
              raise SystemExit("Invalid request_id")
          if target not in {"apk", "aab", "both", "ipa", "exe"}:
              raise SystemExit("Invalid build_target")
          if worker.scheme != "https" or not worker.netloc or worker.username or worker.password:
              raise SystemExit("Invalid worker_url")
          PY

      - name: Create temporary result handoff key
        id: meta
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -Eeuo pipefail
          echo "handoff_cache_key=buildino-handoff-wf16-${GITHUB_RUN_ID}-${REQUEST_ID}" >> "$GITHUB_OUTPUT"

      - name: Download source through authenticated Worker stream
        id: source_intake
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -p incoming handoff/logs

          get_oidc() {
            curl --fail-with-body --silent --show-error --retry 3 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          post_progress() {
            # Progress delivery is best-effort. Telegram/Worker transport failures
            # must never be classified as a user source or build failure.
            local stage="$1"
            local token payload
            if ! token="$(get_oidc 2>/dev/null)"; then
              echo "::warning::Buildino progress OIDC token was unavailable for stage ${stage}."
              return 0
            fi
            payload="$(python3 - "$REQUEST_ID" "$stage" <<'PY'
          import json,sys
          print(json.dumps({"request_id":sys.argv[1],"stage":sys.argv[2]}, separators=(",",":")))
          PY
          )"
            curl --fail-with-body --silent --show-error --retry 3 \
              --request POST \
              --header "Authorization: Bearer ${token}" \
              --header 'content-type: application/json' \
              --data "$payload" \
              "${WORKER_URL%/}/internal/progress" >/dev/null \
              || echo "::warning::Buildino progress delivery failed for stage ${stage}; build continues."
            return 0
          }

          post_progress intake
          token="$(get_oidc)"
          curl --fail-with-body --location --silent --show-error --retry 3 \
            --connect-timeout 20 --max-time 1200 \
            --max-filesize "$MAX_SOURCE_BYTES" \
            --header "Authorization: Bearer ${token}" \
            --output incoming/source.zip \
            "${WORKER_URL%/}/internal/source/${REQUEST_ID}"
          test -s incoming/source.zip
          post_progress validating
          python3 scripts/validate_zip.py incoming/source.zip 2>&1 | tee handoff/logs/source-validation.log
          sha256sum incoming/source.zip | tee handoff/logs/source-sha256.txt

      - name: Set up Java 8 legacy compatibility runtime
        id: java8
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Capture Java 8 home
        id: java8_home
        if: ${{ steps.java8.outcome == 'success' }}
        shell: bash
        run: echo "home=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Set up Java 11 compatibility runtime
        id: java11
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Capture Java 11 home
        id: java11_home
        if: ${{ steps.java11.outcome == 'success' }}
        shell: bash
        run: echo "home=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17 compatibility runtime
        id: java17
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Capture Java 17 home
        id: java17_home
        if: ${{ steps.java17.outcome == 'success' }}
        shell: bash
        run: echo "home=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21 compatibility runtime
        id: java21
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Capture Java 21 home
        id: java21_home
        if: ${{ steps.java21.outcome == 'success' }}
        shell: bash
        run: echo "home=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter stable
        id: flutter
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js for React Native
        id: node
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.4"
          package-manager-cache: false

      - name: Set up Python for Android toolchains
        id: python
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Mark Build stage
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          set +x
          token="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          payload="$(python3 - "$REQUEST_ID" <<'PY'
          import json,sys
          print(json.dumps({"request_id":sys.argv[1],"stage":"building"}, separators=(",",":")))
          PY
          )"
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header 'content-type: application/json' \
            --data "$payload" \
            "${WORKER_URL%/}/internal/progress" >/dev/null

      - name: Build requested output with OIDC variables removed
        id: build_process
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SOURCE_ZIP: incoming/source.zip
          BUILD_TARGET: ${{ inputs.build_target }}
          REQUEST_ID: ${{ inputs.request_id }}
          JAVA8_SETUP_OUTCOME: ${{ steps.java8.outcome }}
          JAVA11_SETUP_OUTCOME: ${{ steps.java11.outcome }}
          JAVA17_SETUP_OUTCOME: ${{ steps.java17.outcome }}
          JAVA21_SETUP_OUTCOME: ${{ steps.java21.outcome }}
          JAVA_HOME_8_X64: ${{ steps.java8_home.outputs.home }}
          JAVA_HOME_11_X64: ${{ steps.java11_home.outputs.home }}
          JAVA_HOME_17_X64: ${{ steps.java17_home.outputs.home }}
          JAVA_HOME_21_X64: ${{ steps.java21_home.outputs.home }}
          FLUTTER_SETUP_OUTCOME: ${{ steps.flutter.outcome }}
          NODE_SETUP_OUTCOME: ${{ steps.node.outcome }}
          PYTHON_SETUP_OUTCOME: ${{ steps.python.outcome }}
          PUB_CACHE: ${{ runner.temp }}/pub-cache
          npm_config_cache: ${{ runner.temp }}/npm-cache
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          set -Eeuo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          bash scripts/run_android_build.sh

      - name: Ensure trusted handoff status exists
        if: ${{ always() }}
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_TARGET: ${{ inputs.build_target }}
          SOURCE_OUTCOME: ${{ steps.source_intake.outcome }}
          JAVA8_OUTCOME: ${{ steps.java8.outcome }}
          JAVA11_OUTCOME: ${{ steps.java11.outcome }}
          JAVA17_OUTCOME: ${{ steps.java17.outcome }}
          JAVA21_OUTCOME: ${{ steps.java21.outcome }}
          FLUTTER_OUTCOME: ${{ steps.flutter.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          BUILD_OUTCOME: ${{ steps.build_process.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p handoff/result
          if [ ! -s handoff/status.json ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path

          source = os.environ.get("SOURCE_OUTCOME", "skipped")
          java8 = os.environ.get("JAVA8_OUTCOME", "skipped")
          java11 = os.environ.get("JAVA11_OUTCOME", "skipped")
          java17 = os.environ.get("JAVA17_OUTCOME", "skipped")
          java21 = os.environ.get("JAVA21_OUTCOME", "skipped")
          flutter = os.environ.get("FLUTTER_OUTCOME", "skipped")
          node = os.environ.get("NODE_OUTCOME", "skipped")
          python = os.environ.get("PYTHON_OUTCOME", "skipped")
          build = os.environ.get("BUILD_OUTCOME", "skipped")
          if source != "success":
              stage, kind, code = "source_intake", "user", 41
          elif any(value != "success" for value in (java8, java11, java17, java21)):
              stage, kind, code = "java_setup", "infrastructure", 42
          elif flutter != "success":
              stage, kind, code = "flutter_setup", "infrastructure", 43
          elif build != "success":
              stage, kind, code = "runner_execution", "infrastructure", 99
          else:
              stage, kind, code = "runner_interrupted", "infrastructure", 100
          Path("handoff/status.json").write_text(json.dumps({
              "status": "failure",
              "failure_stage": stage,
              "failure_kind": kind,
              "failure_code": code,
              "request_id": os.environ["REQUEST_ID"],
              "target": os.environ["BUILD_TARGET"],
              "outputs": [],
              "source_outcome": source,
              "java8_outcome": java8,
              "java11_outcome": java11,
              "java17_outcome": java17,
              "java21_outcome": java21,
              "flutter_outcome": flutter,
              "node_outcome": node,
              "python_outcome": python,
              "build_outcome": build,
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi

          # Raw logs remain inside the build job. Only sanitized reports cross the job boundary.
          rm -rf handoff/logs

      - name: Save result handoff in temporary Actions Cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: handoff
          key: ${{ steps.meta.outputs.handoff_cache_key }}

  windows_build:
    name: Authenticated Flutter or .NET Windows EXE build
    if: ${{ inputs.build_target == 'exe' }}
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
      id-token: write

    steps:
      - name: Checkout trusted Runner template without credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python for source processing
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate EXE dispatch inputs
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_TARGET: ${{ inputs.build_target }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REQUEST_ID -notmatch '^b[0-9]+-[0-9]+-[a-f0-9]{10}$') { throw 'Invalid request_id' }
          if ($env:BUILD_TARGET -ne 'exe') { throw 'Invalid EXE target' }
          $uri = [Uri]$env:WORKER_URL
          if ($uri.Scheme -ne 'https' -or -not $uri.Host) { throw 'Invalid worker_url' }

      - name: Download source through authenticated Worker stream
        id: windows_source_intake
        continue-on-error: true
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force incoming, handoff/logs | Out-Null
          $oidcUri = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$env:OIDC_AUDIENCE"
          $oidc = Invoke-RestMethod -Uri $oidcUri -Headers @{ Authorization = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          $token = [string]$oidc.value
          try {
            $payload = @{ request_id=$env:REQUEST_ID; stage='intake' } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri "$($env:WORKER_URL.TrimEnd('/'))/internal/progress" -Headers @{ Authorization="Bearer $token" } -ContentType 'application/json' -Body $payload | Out-Null
          } catch { Write-Warning "Progress delivery failed; build continues: $($_.Exception.Message)" }
          Invoke-WebRequest -Uri "$($env:WORKER_URL.TrimEnd('/'))/internal/source/$env:REQUEST_ID" -Headers @{ Authorization="Bearer $token" } -OutFile incoming/source.zip -MaximumRedirection 5
          if (-not (Test-Path incoming/source.zip) -or (Get-Item incoming/source.zip).Length -le 0) { throw 'Source ZIP is empty' }
          if ((Get-Item incoming/source.zip).Length -gt [int64]$env:MAX_SOURCE_BYTES) { throw 'Source ZIP exceeds maximum size' }
          python scripts/validate_zip.py incoming/source.zip 2>&1 | Tee-Object -FilePath handoff/logs/source-validation.log
          if ($LASTEXITCODE -ne 0) { throw 'ZIP validation failed' }

      - name: Set up Flutter stable for Windows
        id: windows_flutter
        if: ${{ steps.windows_source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up .NET SDK for Windows
        id: windows_dotnet
        if: ${{ steps.windows_source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Mark Windows build stage
        if: ${{ steps.windows_source_intake.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          try {
            $oidcUri = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$env:OIDC_AUDIENCE"
            $oidc = Invoke-RestMethod -Uri $oidcUri -Headers @{ Authorization = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
            $payload = @{ request_id=$env:REQUEST_ID; stage='building' } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri "$($env:WORKER_URL.TrimEnd('/'))/internal/progress" -Headers @{ Authorization="Bearer $($oidc.value)" } -ContentType 'application/json' -Body $payload | Out-Null
          } catch { Write-Warning "Progress delivery failed; build continues: $($_.Exception.Message)" }

      - name: Build EXE with OIDC variables removed
        id: windows_build_process
        if: ${{ steps.windows_source_intake.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          SOURCE_ZIP: incoming/source.zip
          BUILD_TARGET: exe
          REQUEST_ID: ${{ inputs.request_id }}
          PUB_CACHE: ${{ runner.temp }}/pub-cache
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: |
          Remove-Item Env:ACTIONS_ID_TOKEN_REQUEST_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:ACTIONS_ID_TOKEN_REQUEST_URL -ErrorAction SilentlyContinue
          ./scripts/run_windows_build.ps1

      - name: Ensure Windows handoff status exists
        if: ${{ always() }}
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_OUTCOME: ${{ steps.windows_source_intake.outcome }}
          BUILD_OUTCOME: ${{ steps.windows_build_process.outcome }}
        run: |
          New-Item -ItemType Directory -Force handoff/result | Out-Null
          if (-not (Test-Path handoff/status.json)) {
            $stage = if ($env:SOURCE_OUTCOME -ne 'success') { 'source_intake' } else { 'windows_runner_execution' }
            $kind = if ($env:SOURCE_OUTCOME -ne 'success') { 'user' } else { 'infrastructure' }
            @{ status='failure'; failure_stage=$stage; failure_kind=$kind; failure_code=99; request_id=$env:REQUEST_ID; target='exe'; outputs=@() } | ConvertTo-Json -Depth 8 | Set-Content handoff/status.json -Encoding UTF8
          }
          Remove-Item -Recurse -Force handoff/logs -ErrorAction SilentlyContinue

      - name: Save Windows result handoff in temporary Actions Cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: handoff
          key: buildino-handoff-wf16-${{ github.run_id }}-${{ inputs.request_id }}

  ios_build:
    name: Authenticated Flutter iOS IPA build on macOS
    if: ${{ inputs.build_target == 'ipa' }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
      id-token: write

    steps:
      - name: Checkout trusted Runner template without credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate IPA dispatch inputs
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_TARGET: ${{ inputs.build_target }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PYIOSVALIDATE'
          import os,re
          from urllib.parse import urlparse
          if not re.fullmatch(r'b[0-9]+-[0-9]+-[a-f0-9]{10}',os.environ['REQUEST_ID']):raise SystemExit('Invalid request_id')
          if os.environ['BUILD_TARGET']!='ipa':raise SystemExit('Invalid IPA target')
          u=urlparse(os.environ['WORKER_URL'])
          if u.scheme!='https' or not u.netloc:raise SystemExit('Invalid worker_url')
          PYIOSVALIDATE

      - name: Download source through authenticated Worker stream
        id: ios_source_intake
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -p incoming handoff/logs
          token="$(curl --fail-with-body --silent --show-error --retry 3 --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          payload="$(python3 - "$REQUEST_ID" <<'PY'
          import json,sys
          print(json.dumps({'request_id':sys.argv[1],'stage':'intake'},separators=(',',':')))
          PY
          )"
          curl --fail-with-body --silent --show-error --retry 3 --request POST --header "Authorization: Bearer ${token}" --header 'content-type: application/json' --data "$payload" "${WORKER_URL%/}/internal/progress" >/dev/null || echo '::warning::Progress delivery failed; build continues.'
          curl --fail-with-body --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 1200 --max-filesize "$MAX_SOURCE_BYTES" --header "Authorization: Bearer ${token}" --output incoming/source.zip "${WORKER_URL%/}/internal/source/${REQUEST_ID}"
          test -s incoming/source.zip
          python3 scripts/validate_zip.py incoming/source.zip 2>&1 | tee handoff/logs/source-validation.log

      - name: Set up Flutter stable for iOS
        id: ios_flutter
        if: ${{ steps.ios_source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mark iOS build stage
        if: ${{ steps.ios_source_intake.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          token="$(curl --fail-with-body --silent --show-error --retry 3 --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          payload="$(python3 - "$REQUEST_ID" <<'PY'
          import json,sys
          print(json.dumps({'request_id':sys.argv[1],'stage':'building'},separators=(',',':')))
          PY
          )"
          curl --fail-with-body --silent --show-error --retry 3 --request POST --header "Authorization: Bearer ${token}" --header 'content-type: application/json' --data "$payload" "${WORKER_URL%/}/internal/progress" >/dev/null || true

      - name: Build unsigned Flutter IPA with OIDC variables removed
        id: ios_build_process
        if: ${{ steps.ios_source_intake.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SOURCE_ZIP: incoming/source.zip
          BUILD_TARGET: ipa
          REQUEST_ID: ${{ inputs.request_id }}
          PUB_CACHE: ${{ runner.temp }}/pub-cache
        run: |
          set -Eeuo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          bash scripts/run_ios_build.sh

      - name: Apply optional Apple signing in isolated step
        id: ios_signing
        if: ${{ steps.ios_build_process.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUILDINO_IOS_P12_BASE64: ${{ secrets.BUILDINO_IOS_P12_BASE64 }}
          BUILDINO_IOS_P12_PASSWORD: ${{ secrets.BUILDINO_IOS_P12_PASSWORD }}
          BUILDINO_IOS_PROVISION_PROFILE_BASE64: ${{ secrets.BUILDINO_IOS_PROVISION_PROFILE_BASE64 }}
          BUILDINO_IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.BUILDINO_IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -Eeuo pipefail
          set +x
          archive="$(find handoff/ios_archive -maxdepth 1 -type d -name '*.xcarchive' | head -n1 || true)"
          if [ -z "${BUILDINO_IOS_P12_BASE64:-}" ] || [ -z "${BUILDINO_IOS_P12_PASSWORD:-}" ] || [ -z "${BUILDINO_IOS_PROVISION_PROFILE_BASE64:-}" ] || [ -z "${BUILDINO_IOS_EXPORT_OPTIONS_PLIST_BASE64:-}" ] || [ -z "$archive" ]; then
            echo 'Apple signing secrets are incomplete; keeping unsigned IPA.'
            rm -rf handoff/ios_archive
            exit 0
          fi
          python3 - <<'PYIOSSECRETS'
          import base64,os
          from pathlib import Path
          for env_name,path in [('BUILDINO_IOS_P12_BASE64','/tmp/buildino-cert.p12'),('BUILDINO_IOS_PROVISION_PROFILE_BASE64','/tmp/buildino.mobileprovision'),('BUILDINO_IOS_EXPORT_OPTIONS_PLIST_BASE64','/tmp/buildino-export-options.plist')]:
              Path(path).write_bytes(base64.b64decode(os.environ[env_name]))
          PYIOSSECRETS
          keychain="buildino-${GITHUB_RUN_ID}.keychain-db"; keypass="buildino-${GITHUB_RUN_ID}-${RANDOM}"
          security create-keychain -p "$keypass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keypass" "$keychain"
          security import /tmp/buildino-cert.p12 -k "$keychain" -P "$BUILDINO_IOS_P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keypass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security cms -D -i /tmp/buildino.mobileprovision > /tmp/buildino-profile.plist
          uuid="$(python3 -c 'import plistlib;print(plistlib.load(open("/tmp/buildino-profile.plist","rb"))["UUID"])')"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/buildino.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
          rm -rf /tmp/buildino-export && mkdir -p /tmp/buildino-export
          xcodebuild -exportArchive -archivePath "$archive" -exportPath /tmp/buildino-export -exportOptionsPlist /tmp/buildino-export-options.plist 2>&1 | tee /tmp/buildino-ios-export.log
          signed="$(find /tmp/buildino-export -maxdepth 1 -type f -name '*.ipa' -size +0c | head -n1)"
          test -s "$signed"
          rm -f handoff/result/*.ipa
          cp "$signed" "handoff/result/${REQUEST_ID}.ipa"
          python3 - <<'PYIOSSTATUS'
          import json
          from pathlib import Path
          p=Path('handoff/status.json');d=json.loads(p.read_text());d['ios_signing']='signed';d['outputs']=[{'type':'ipa','name':x.name,'size':x.stat().st_size} for x in Path('handoff/result').glob('*.ipa')];p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PYIOSSTATUS
          rm -rf handoff/ios_archive /tmp/buildino-cert.p12 /tmp/buildino.mobileprovision /tmp/buildino-export-options.plist /tmp/buildino-profile.plist

      - name: Convert optional signing error into unsigned success
        if: ${{ always() && steps.ios_build_process.outcome == 'success' && steps.ios_signing.outcome != 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '::warning::Apple signing failed; unsigned IPA remains available.'
          rm -rf handoff/ios_archive

      - name: Ensure iOS handoff status exists
        if: ${{ always() }}
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_OUTCOME: ${{ steps.ios_source_intake.outcome }}
          BUILD_OUTCOME: ${{ steps.ios_build_process.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p handoff/result
          if [ ! -s handoff/status.json ]; then
            python3 - <<'PYIOSSTATUS2'
          import json,os
          from pathlib import Path
          stage='source_intake' if os.environ.get('SOURCE_OUTCOME')!='success' else 'ios_runner_execution'
          kind='user' if stage=='source_intake' else 'infrastructure'
          Path('handoff/status.json').write_text(json.dumps({'status':'failure','failure_stage':stage,'failure_kind':kind,'failure_code':99,'request_id':os.environ['REQUEST_ID'],'target':'ipa','outputs':[]},ensure_ascii=False,indent=2)+'\n')
          PYIOSSTATUS2
          fi
          rm -rf handoff/logs handoff/ios_archive

      - name: Save iOS result handoff in temporary Actions Cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: handoff
          key: buildino-handoff-wf16-${{ github.run_id }}-${{ inputs.request_id }}

  publish:
    name: Trusted temporary Release publication
    needs: [build, windows_build, ios_build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      id-token: write

    steps:
      - name: Restore build handoff
        id: restore_handoff
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: handoff
          key: buildino-handoff-wf16-${{ github.run_id }}-${{ inputs.request_id }}
          fail-on-cache-miss: false

      - name: Ensure publish handoff exists
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_TARGET: ${{ inputs.build_target }}
          BUILD_JOB_RESULT: android=${{ needs.build.result }},windows=${{ needs.windows_build.result }},ios=${{ needs.ios_build.result }}
          RESTORE_OUTCOME: ${{ steps.restore_handoff.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p handoff/result
          if [ ! -s handoff/status.json ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("handoff/status.json").write_text(json.dumps({
              "status": "failure",
              "failure_stage": "handoff_missing",
              "failure_kind": "infrastructure",
              "failure_code": 98,
              "request_id": os.environ["REQUEST_ID"],
              "target": os.environ["BUILD_TARGET"],
              "outputs": [],
              "build_job_result": os.environ["BUILD_JOB_RESULT"],
              "restore_outcome": os.environ["RESTORE_OUTCOME"],
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi

      - name: Mark publication stage
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          set +x
          token="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          payload="$(python3 - "$REQUEST_ID" <<'PY'
          import json,sys
          print(json.dumps({"request_id":sys.argv[1],"stage":"publishing"}, separators=(",",":")))
          PY
          )"
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header 'content-type: application/json' \
            --data "$payload" \
            "${WORKER_URL%/}/internal/progress" >/dev/null

      - name: Set up Java for isolated fallback signing
        if: ${{ always() }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Buildino fallback signature in isolated publication job
        id: fallback_signing
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          set +x
          status="$(python3 -c 'import json; print(json.load(open("handoff/status.json"))["status"])')"
          fallback="$(python3 -c 'import json; print(str(json.load(open("handoff/status.json")).get("fallback_signing_used",False)).lower())')"
          if [ "$status" != "success" ] || [ "$fallback" != "true" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "required=true" >> "$GITHUB_OUTPUT"
          token="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          curl --fail-with-body --silent --show-error --retry 5 \
            --header "Authorization: Bearer ${token}" \
            "${WORKER_URL%/}/internal/fallback-signing/${REQUEST_ID}" > /tmp/buildino-signing.json
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          data=json.loads(Path('/tmp/buildino-signing.json').read_text())
          Path('/tmp/buildino-fallback.jks').write_bytes(base64.b64decode(data['keystore_base64']))
          PY
          eval "$(python3 - <<'PY'
          import json, shlex
          from pathlib import Path
          data=json.loads(Path('/tmp/buildino-signing.json').read_text())
          for key in ('alias','store_password','key_password','certificate_sha256','keystore_sha256'):
              print(f"export {key.upper()}={shlex.quote(str(data[key]))}")
          PY
          )"
          actual="$(sha256sum /tmp/buildino-fallback.jks | awk '{print $1}')"
          [ "$actual" = "$KEYSTORE_SHA256" ] || { echo "Fallback Keystore integrity mismatch" >&2; exit 51; }
          build_tools="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          [ -x "$apksigner" ] && [ -x "$zipalign" ]
          export BUILDINO_STORE_PASS="$STORE_PASSWORD" BUILDINO_KEY_PASS="$KEY_PASSWORD"
          while IFS= read -r file; do
            case "$file" in
              *.apk)
                aligned="${file%.apk}.aligned.apk"
                signed="${file%.apk}.signed.apk"
                "$zipalign" -p -f 4 "$file" "$aligned"
                "$apksigner" sign --ks /tmp/buildino-fallback.jks --ks-key-alias "$ALIAS" \
                  --ks-pass env:BUILDINO_STORE_PASS --key-pass env:BUILDINO_KEY_PASS \
                  --out "$signed" "$aligned"
                "$apksigner" verify --verbose --print-certs "$signed" >/tmp/apksigner-verify.txt
                mv "$signed" "$file"; rm -f "$aligned"
                ;;
              *.aab)
                jarsigner -keystore /tmp/buildino-fallback.jks \
                  -storepass:env BUILDINO_STORE_PASS -keypass:env BUILDINO_KEY_PASS \
                  -sigalg SHA256withRSA -digestalg SHA-256 "$file" "$ALIAS" >/tmp/jarsigner-sign.txt
                jarsigner -verify -verbose -certs "$file" >/tmp/jarsigner-verify.txt
                grep -Fq "jar verified" /tmp/jarsigner-verify.txt
                ;;
            esac
          done < <(find handoff/result -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' -o -name '*.exe' -o -name '*.zip' \) -size +0c | sort)
          CERTIFICATE_SHA256="$CERTIFICATE_SHA256" python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('handoff/status.json'); data=json.loads(path.read_text())
          data['fallback_signing_applied']=True
          data['signing_certificate_sha256']=os.environ['CERTIFICATE_SHA256']
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -f /tmp/buildino-signing.json /tmp/buildino-fallback.jks

      - name: Create temporary Release and result payload
        id: prepare_result
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -Eeuo pipefail
          set +x
          status="$(python3 -c 'import json; print(json.load(open("handoff/status.json"))["status"])')"
          failure_stage="$(python3 -c 'import json; print(json.load(open("handoff/status.json")).get("failure_stage","unknown"))')"
          failure_kind="$(python3 -c 'import json; print(json.load(open("handoff/status.json")).get("failure_kind","user"))')"
          tag="buildino-${REQUEST_ID}"

          if [ "$status" = "success" ]; then
            mapfile -t files < <(find handoff/result -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' -o -name '*.exe' -o -name '*.zip' \) -size +0c | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No output file found in handoff." >&2
              exit 1
            fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Buildino temporary output" \
              --notes "Temporary Buildino output. Automatically deleted after approximately 48 hours." \
              "${files[@]}"

            gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > release.json
            python3 - "$REQUEST_ID" "$tag" > result.json <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          request_id, tag = sys.argv[1:]
          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          by_name = {asset["name"]: asset for asset in release.get("assets", [])}
          assets = []
          for path in sorted(Path("handoff/result").iterdir()):
              if path.suffix not in {".apk", ".aab", ".ipa", ".exe", ".zip"} or not path.is_file():
                  continue
              remote = by_name.get(path.name)
              if not remote:
                  raise SystemExit(f"Release asset missing: {path.name}")
              assets.append({
                  "type": path.suffix[1:],
                  "name": path.name,
                  "url": remote["browser_download_url"],
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              })
          status=json.loads(Path("handoff/status.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "request_id": request_id,
              "status": "success",
              "conclusion": "success",
              "release_tag": tag,
              "quota_action": "consume",
              "assets": assets,
              "fallback_signing_applied": bool(status.get("fallback_signing_applied", False)),
              "signing_certificate_sha256": status.get("signing_certificate_sha256"),
              "ios_signing": status.get("ios_signing"),
              "framework": status.get("framework"),
              "package_manager": status.get("package_manager"),
              "auto_fixes": status.get("auto_fixes", []),
              "project_prepare": status.get("project_prepare"),
              "project_discovery": status.get("project_discovery"),
          }, ensure_ascii=False, separators=(",",":")))
          PY
          else
            quota_action="consume"
            if [ "$failure_kind" = "infrastructure" ]; then quota_action="release"; fi
            python3 - "$REQUEST_ID" "$failure_stage" "$quota_action" > result.json <<'PY'
          import json,sys
          from pathlib import Path
          request_id, stage, quota_action = sys.argv[1:]
          report={}
          status=json.loads(Path("handoff/status.json").read_text(encoding="utf-8")) if Path("handoff/status.json").is_file() else {}
          if Path("handoff/error-report.json").is_file():
              report=json.loads(Path("handoff/error-report.json").read_text(encoding="utf-8"))
          excerpt="\n".join(f"• {line}" for line in report.get("technical_excerpt",[])[:8])
          parts=[
              f"دسته خطا: {report.get('title','خطای Build')}",
              f"مرحله: {report.get('stage',stage)}",
              f"کد خروج: {report.get('exit_code','نامشخص')}",
              "",
              f"علت: {report.get('cause','جزئیات فنی در Workflow ثبت شده است.')}",
              "",
              f"راه‌حل: {report.get('solution','گزارش Workflow را بررسی کنید.')}",
          ]
          if report.get("fallback_signing_used"):
              parts += ["", "امضای fallback بیلدینو در Preflight فعال شده بود."]
          if report.get("java_version"):
              parts += [f"Java انتخاب‌شده: {report['java_version']}"]
          if report.get("flavors"):
              parts += ["Flavorهای شناسایی‌شده: " + ", ".join(report["flavors"])]
          prepared=report.get("project_prepare") or {}
          if prepared:
              if prepared.get("mode"):
                  parts += ["حالت آماده‌سازی پروژه: " + str(prepared.get("mode"))]
              if prepared.get("android_generated"):
                  parts += ["پلتفرم Android به‌صورت خودکار ساخته شد."]
              if prepared.get("overlay_path"):
                  parts += ["Android Overlay: " + str(prepared.get("overlay_path"))]
              for action in (prepared.get("actions") or [])[:5]:
                  parts += ["• " + str(action)]
          fixes=report.get("auto_fixes",[])
          if fixes:
              rendered=[]
              for fix in fixes[:8]:
                  rendered.append(f"• {fix.get('before','?')} → {fix.get('after','?')} در {fix.get('file','?')}:{fix.get('actual_line','?')}")
              parts += ["", "اصلاحات خودکار اعمال‌شده پیش از تلاش دوم:", *rendered]
          if excerpt:
              parts += ["", "خلاصه فنی:", excerpt]
          print(json.dumps({
              "request_id": request_id, "status": "failure",
              "conclusion": "failure",
              "error_summary": "\n".join(parts)[:3200],
              "error_category": report.get("category","unknown"),
              "auto_fixes": report.get("auto_fixes", []),
              "project_prepare": report.get("project_prepare"),
              "framework": report.get("framework") or status.get("framework"),
              "ios_signing": status.get("ios_signing"),
              "package_manager": status.get("package_manager"),
              "project_discovery": report.get("project_discovery"),
              "quota_action": quota_action, "assets": [],
          }, ensure_ascii=False, separators=(",",":")))
          PY
          fi

      - name: Convert isolated signing failure into a trusted result
        if: ${{ always() && steps.fallback_signing.outputs.required == 'true' && steps.fallback_signing.outcome != 'success' }}
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("result.json").write_text(json.dumps({
              "request_id": os.environ["REQUEST_ID"], "status": "failure",
              "conclusion": "failure",
              "error_summary": "دسته خطا: سرویس امضای fallback بیلدینو\nمرحله: isolated_fallback_signing\n\nعلت: خروجی پروژه ساخته شد اما اعمال امضای اختصاصی بیلدینو ناموفق بود.\n\nراه‌حل: Secrets امضای fallback و سلامت Keystore را بررسی کنید.",
              "error_category": "fallback_signing", "quota_action": "release", "assets": [],
          }, ensure_ascii=False, separators=(",",":")), encoding="utf-8")
          PY

      - name: Create infrastructure fallback result
        if: ${{ always() }}
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PREPARE_OUTCOME: ${{ steps.prepare_result.outcome }}
        run: |
          set -Eeuo pipefail
          if [ ! -s result.json ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("result.json").write_text(json.dumps({
              "request_id": os.environ["REQUEST_ID"],
              "status": "failure",
              "conclusion": "failure",
              "error_summary": "انتشار خروجی در GitHub Release ناموفق بود.",
              "quota_action": "release",
              "assets": [],
              "publish_outcome": os.environ.get("PREPARE_OUTCOME", "unknown"),
          }, ensure_ascii=False, separators=(",",":")), encoding="utf-8")
          PY
          fi

      - name: Send final result to Buildino
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          set +x
          token="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          curl --fail-with-body --silent --show-error --retry 5 \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header 'content-type: application/json' \
            --data-binary @result.json \
            "${WORKER_URL%/}/internal/result" >/dev/null

      - name: Delete temporary handoff cache
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_KEY: buildino-handoff-wf16-${{ github.run_id }}-${{ inputs.request_id }}
        run: |
          set -Eeuo pipefail
          encoded="$(python3 - "$HANDOFF_KEY" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=""))
          PY
          )"
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches?key=${encoded}" >/dev/null 2>&1 || true

      - name: Build summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Buildino Runner WF-16"
            echo
            echo "- Request: ${{ inputs.request_id }}"
            echo "- Target: ${{ inputs.build_target }}"
            echo "- Source transfer: authenticated GitHub OIDC stream"
            echo "- Source cache: not used"
            echo "- Release retention: approximately 48 hours"
            echo "- Actions Artifact: not used"
            echo "- Adaptive mode: Android, Windows EXE, and Flutter iOS IPA routing with project discovery and isolated publication"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark workflow failed when Build failed
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(python3 -c 'import json; print(json.load(open("result.json"))["status"])')"
          [ "$status" = "success" ] || exit 1
